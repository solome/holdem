      <div class="replay-notes">
        <p class="replay-line" data-at="preflop"><strong>翻牌前</strong> · 九人桌，盲注 5/10。你有 2,800，最先行动。按钮位有 2,200，小盲有 900，两人都打得主动。</p><p class="replay-line" data-at="flop"><strong>翻牌</strong> · 原局你只跟 10，克林、腾腾、星星都跟，敏敏补齐，旺旺过牌，六人底池 60。两盲、你及两个中位都过牌，星星下注 45；小盲弃，大盲和你跟，两个中位弃。</p><p class="replay-line" data-at="turn"><strong>转牌</strong> · 大盲过牌。现在有一张 7 就成顺，你和按钮也都过牌。</p><p class="replay-line" data-at="river"><strong>河牌</strong> · 大盲下注 100，你和按钮都弃牌。无人跟的 100 退回，大盲收下 195。</p>
        <div class="street-review" data-at="flop"><details class="example-answer"><summary>超对在翻牌有哪两次主动下注的机会？</summary><p>两盲过牌时，原分析倾向直接下约一池，向对子和听顺收费。原局你过牌，等按钮下 45、大盲跟进时，池中已有 150，还可以考虑加到约 200。按钮可能是在全桌示弱后下注，大盲也未必是强成牌；但六人看翻牌，76 已成顺，两对与暗三条也在范围里，加注前仍要计划怎样回应再加。</p></details></div><div class="street-review" data-at="turn"><details class="example-answer"><summary>6♥ 为什么值得停下来？</summary><p>原来愿意跟 45 的 7x 已经成顺。面对两个对手，用 <span class="cash-inline-hand" role="img" aria-label="QQ，花色未指定"><b>QQ</b><span class="cash-hand-cards"><i class="playing-card rank-only">Q</i><i class="playing-card rank-only">Q</i></span></span> 再下注，很难得到更差牌的跟注。一轮过牌能保留超对的摊牌价值。</p></details></div>

          <p class="example-decision"><strong>优先加注到 30，让较弱的牌付钱看翻牌。</strong><span class="cash-inline-hand" role="img" aria-label="QQ，花色未指定"><b>QQ</b><span class="cash-hand-cards"><i class="playing-card rank-only">Q</i><i class="playing-card rank-only">Q</i></span></span> 领先许多愿意跟的对子和高牌。加注有机会缩减人数，即使有人跟进，也能在领先时多收一注。若身后几乎每次都会加注，才有理由考虑平跟后再加；在一张大家都爱跟的桌上，平跟更可能招来一圈跟注。</p>

        <div class="replay-analysis" data-at="turn">
          <h3 class="example-question">深筹码击中暗三条，转牌遭遇加注，该用它打光吗？</h3>
