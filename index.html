<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f7f6f0" />
    <meta
      name="description"
      content="Holdem — 珍藏你的德州扑克高光时刻。皇家同花顺、同花顺与四条金刚的个人成就图鉴。"
    />
    <title>Holdem — 掬一捧的德州好牌图鉴</title>
    <style>
      @charset "UTF-8";
:root {
  color-scheme: light;
  --page: #f7f6f0;
  --ink: #203d30;
  --muted: #7d8176;
  --line: #e2e3d9;
  --green: #214e3a;
  --gold: #b49a5b;
  --suit-spades: #202323;
  --suit-clubs: #247342;
  --suit-hearts: #c3423f;
  --suit-diamonds: #3069c4;
  --serif: Georgia, "Songti SC", "Noto Serif CJK SC", "Noto Serif TC", serif;
  --sans:
    Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
    "PingFang TC", "Microsoft YaHei", sans-serif;
}
* {
  box-sizing: border-box;
}
html {
  scroll-behavior: smooth;
  scroll-padding-top: 26px;
}
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 14px;
  -webkit-font-smoothing: antialiased;
}
button,
select,
input {
  font: inherit;
}
button,
a,
select,
input {
  -webkit-tap-highlight-color: transparent;
}
button,
a,
select {
  touch-action: manipulation;
}
button {
  color: inherit;
}
button {
  cursor: pointer;
}
a {
  color: inherit;
  text-decoration: none;
}
button:focus-visible,
a:focus-visible,
select:focus-visible,
input:focus-visible {
  outline: 3px solid #b28c42;
  outline-offset: 5px;
}
button {
  border: 0;
}
button:disabled {
  cursor: default;
}
svg {
  display: block;
}
button svg {
  flex-shrink: 0;
}
.wrap {
  width: min(1240px, calc(100% - 96px));
  margin-inline: auto;
}
.skip-link {
  position: fixed;
  top: -100px;
  left: 16px;
  background: var(--ink);
  color: white;
  padding: 12px 20px;
  z-index: 100;
}
.skip-link:focus {
  top: 16px;
}
.site-header {
  height: 102px;
  display: flex;
  align-items: center;
  gap: 24px;
  border-bottom: 1px solid var(--line);
}
.brand {
  display: inline-flex;
  align-items: center;
  gap: 11px;
  font: 600 36px/1 var(--serif);
  letter-spacing: -1.7px;
}
.brand-mark {
  font-size: 33px;
}
.brand-period {
  color: #ac8e4f;
}
.header-nav {
  margin-left: auto;
  display: flex;
  gap: 27px;
  align-items: center;
}
.nav-link {
  font-size: 13px;
  background: none;
  padding: 12px 0;
  color: #85897e;
}
.nav-link.active {
  color: var(--green);
}
.nav-link:hover {
  color: var(--ink);
}
.language-picker {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-left: 19px;
  border-left: 1px solid var(--line);
  padding-left: 24px;
}
.language-icon {
  font-size: 13px;
  position: relative;
  margin-right: 5px;
}
.language-icon span {
  font-size: 10px;
  position: absolute;
  bottom: -3px;
  right: -6px;
}
.language-picker select {
  max-width: 122px;
  border: 0;
  color: var(--ink);
  background: transparent;
  font-size: 12px;
  padding: 8px 15px 8px 3px;
  cursor: pointer;
}
.hero {
  display: grid;
  grid-template-columns: 1fr 1.08fr;
  gap: 60px;
  align-items: center;
  padding: 54px 0 45px;
}
.hero h1 {
  font-family: var(--serif);
  font-weight: 500;
  font-size: 64px;
  line-height: 1.18;
  letter-spacing: 1px;
  margin: 0 0 20px;
}
.hero h1 span {
  color: #57725e;
}
.hero-copy > p {
  color: #777f6e;
  font-size: 13px;
  line-height: 1.95;
  letter-spacing: 0.6px;
  margin-bottom: 26px;
}
.primary-button {
  display: inline-flex;
  align-items: center;
  justify-content: space-between;
  gap: 35px;
  padding: 14px 19px;
  background: var(--green);
  border-radius: 4px;
  color: #fffef5;
  font-size: 12px;
  letter-spacing: 0.5px;
  transition:
    background 0.2s,
    transform 0.2s;
}
.primary-button:hover {
  background: #173d2c;
  transform: translateY(-2px);
}
.primary-button > span:last-child {
  font-size: 20px;
  line-height: 15px;
}
.hero-table {
  height: 365px;
  position: relative;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: space-between;
  isolation: isolate;
  padding: 37px 30px 32px;
  border-radius: 10px;
  background: #214b3a;
  background-image: radial-gradient(
    ellipse at 50% 35%,
    #38614a 0%,
    #224c39 50%,
    #193f2f 100%
  );
  color: #e4d6a6;
  box-shadow:
    inset 0 0 0 1px #183729,
    0 12px 30px -22px #162f20;
  overflow: hidden;
}
.hero-table:after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  opacity: 0.16;
  background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' opacity='.5' filter='url(%23n)'/%3E%3C/svg%3E");
  mix-blend-mode: soft-light;
  z-index: -1;
}
.table-inner {
  position: absolute;
  inset: 15px;
  border: 1px solid #b3bc8b33;
  border-radius: 6px;
  pointer-events: none;
  z-index: -1;
}
.table-inner:before {
  content: "";
  position: absolute;
  inset: 9px;
  border: 1px solid #b3bc8b15;
  border-radius: 4px;
}
.table-inner:after {
  content: "";
  position: absolute;
  width: 72%;
  height: 72%;
  left: 14%;
  top: 14%;
  border-radius: 50%;
  border: 1px solid #b3bc8b17;
  box-shadow: 0 0 0 15px #b3bc8b04;
}
.table-eyebrow {
  font-size: 10px;
  letter-spacing: 3px;
  display: flex;
  align-items: center;
  gap: 16px;
  opacity: 0.85;
}
.table-eyebrow > span:first-child,
.table-eyebrow > span:last-child {
  font-size: 12px;
}
.table-corner {
  position: absolute;
  left: 31px;
  top: 29px;
  text-align: center;
  font: 18px/1.1 var(--serif);
  opacity: 0.45;
}
.corner-bottom {
  left: auto;
  top: auto;
  right: 31px;
  bottom: 29px;
  transform: rotate(180deg);
}
.hero-fan {
  display: flex;
  justify-content: center;
  align-items: center;
  height: 169px;
  width: 100%;
  margin-top: 4px;
  padding-top: 18px;
  perspective: 1000px;
}
.suit-spades {
  --suit-color: var(--suit-spades);
}
.suit-clubs {
  --suit-color: var(--suit-clubs);
}
.suit-hearts {
  --suit-color: var(--suit-hearts);
}
.suit-diamonds {
  --suit-color: var(--suit-diamonds);
}
.playing-card {
  --card-w: 45px;
  --card-h: 65px;
  display: inline-block;
  position: relative;
  flex-shrink: 0;
  width: var(--card-w);
  height: var(--card-h);
  border-radius: 4px;
  background: #fffdf5;
  color: var(--suit-color, var(--suit-spades));
  border: 1px solid #dbdfd3;
  box-shadow: 0 2px 5px #23392c12;
  font-family: var(--serif);
  text-align: center;
  font-weight: 600;
  transform: rotate(var(--angle, 0deg)) translateY(var(--y, 0px));
  transform-origin: 50% 110%;
  user-select: none;
}
.card-corner {
  position: absolute;
  top: 4px;
  left: 5px;
  display: flex;
  flex-direction: column;
  font-size: 14px;
  line-height: 1;
}
.card-corner .corner-suit {
  font-size: 10px;
  line-height: 1.1;
  margin-top: 1px;
}
.card-corner.bottom {
  left: auto;
  top: auto;
  bottom: 4px;
  right: 5px;
  transform: rotate(180deg);
}
.card-pip {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 27px;
}
.royal-card .card-pip {
  font-size: 29px;
}
.royal-card .card-pip:before {
  content: "";
  position: absolute;
  width: 49%;
  height: 56%;
  border: 1px solid currentColor;
  opacity: 0.18;
  transform: rotate(-5deg);
  border-radius: 50%;
}
.hero-fan .playing-card {
  --card-w: 83px;
  --card-h: 125px;
  border-radius: 6px;
  box-shadow: 0 5px 12px #061f2840;
  border-color: #e4dfcb;
  margin-left: -16px;
  transition: transform 0.55s cubic-bezier(0.2, 0.7, 0.2, 1);
}
.hero-fan .playing-card:first-child {
  margin-left: 0;
}
.hero-fan .card-corner {
  top: 7px;
  left: 8px;
  font-size: 23px;
}
.hero-fan .card-corner .corner-suit {
  font-size: 15px;
}
.hero-fan .card-corner.bottom {
  top: auto;
  left: auto;
  right: 8px;
  bottom: 7px;
}
.hero-fan .card-pip {
  font-size: 43px;
}
.hero-fan .royal-card .card-pip {
  font-size: 48px;
}
.hero-table:hover .hero-fan .playing-card {
  transform: rotate(calc(var(--angle) * 1.16)) translateY(calc(var(--y) - 5px));
}
.table-caption {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 9px;
}
.hero-achievement-name {
  font: 400 23px var(--serif);
  letter-spacing: 4px;
}
.table-subtitle {
  font-size: 9px;
  letter-spacing: 1px;
  opacity: 0.6;
  display: flex;
  align-items: center;
  gap: 10px;
}
.caption-dot {
  opacity: 0.6;
}
.hero-open {
  position: absolute;
  bottom: 30px;
  right: 67px;
  opacity: 0.55;
  font-size: 20px;
}
.stats {
  display: grid;
  grid-template-columns: 1.1fr 1fr 1fr 1fr;
  align-items: center;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
  padding: 25px 0;
}
.stat {
  display: flex;
  align-items: center;
  gap: 21px;
  min-height: 54px;
  padding-left: 34px;
  border-left: 1px solid var(--line);
}
.stat:first-child {
  border-left: 0;
  padding-left: 0;
}
.stat-label {
  font-size: 11px;
  color: #878b7e;
  letter-spacing: 0.5px;
  margin-bottom: 6px;
}
.stat-value {
  font: 400 31px/1 var(--serif);
  font-variant-numeric: tabular-nums;
  letter-spacing: -1px;
}
.stat-denominator {
  font: 400 14px var(--sans);
  color: #a0a397;
  letter-spacing: 0;
}
.stat-symbol {
  font: 40px var(--serif);
  color: #a3a78d;
  width: 34px;
  text-align: center;
}
.flush-symbol {
  font-size: 36px;
}
.quads-symbol {
  position: relative;
  font-size: 37px;
}
.quads-symbol > span {
  font-size: 14px;
  position: absolute;
  right: -5px;
  bottom: 0;
}
.progress-ring {
  height: 57px;
  width: 57px;
  border-radius: 50%;
  background: conic-gradient(var(--green) 12%, #e5e7dc 0);
  display: grid;
  place-items: center;
}
.progress-ring > span {
  height: 49px;
  width: 49px;
  background: var(--page);
  border-radius: 50%;
  display: flex;
  justify-content: center;
  align-items: center;
  font: 20px var(--serif);
}
.progress-ring small {
  font: 9px var(--sans);
  margin-top: 5px;
  margin-left: 1px;
}
.collection {
  padding-top: 54px;
}
.collection-heading {
  display: flex;
  justify-content: space-between;
  align-items: flex-end;
  gap: 20px;
}
.collection h2 {
  font: 400 29px/1.3 var(--serif);
  letter-spacing: 0.4px;
  margin: 0;
}
.unlocked-toggle {
  display: flex;
  align-items: center;
  gap: 9px;
  white-space: nowrap;
  font-size: 11px;
  cursor: pointer;
  padding-bottom: 6px;
  position: relative;
}
.unlocked-toggle input {
  position: absolute;
  width: 32px;
  height: 18px;
  opacity: 0;
  left: 0;
  top: 0;
  cursor: pointer;
}
.switch {
  width: 29px;
  height: 17px;
  background: #d9ddcf;
  border-radius: 12px;
  position: relative;
  transition: background 0.2s;
}
.switch:after {
  content: "";
  width: 11px;
  height: 11px;
  border-radius: 50%;
  background: #fff;
  position: absolute;
  left: 3px;
  top: 3px;
  transition: transform 0.2s;
  box-shadow: 0 1px 2px #20372922;
}
.unlocked-toggle input:checked + .switch {
  background: var(--green);
}
.unlocked-toggle input:checked + .switch:after {
  transform: translateX(12px);
}
.unlocked-toggle input:focus-visible + .switch {
  outline: 3px solid #b28c42;
  outline-offset: 4px;
}
.collection-toolbar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
  margin: 28px 0 28px;
  border-bottom: 1px solid var(--line);
}
.category-tabs {
  display: flex;
  gap: 27px;
  overflow: auto;
  scrollbar-width: none;
}
.category-tabs::-webkit-scrollbar {
  display: none;
}
.category-tab {
  display: flex;
  align-items: center;
  gap: 8px;
  position: relative;
  white-space: nowrap;
  font-size: 12px;
  color: #969b8e;
  padding: 0 0 16px;
  background: transparent;
  border-bottom: 2px solid transparent;
}
.category-tab[aria-pressed="true"] {
  color: var(--ink);
  border-bottom-color: var(--green);
}
.tab-count {
  font: 10px var(--sans);
  padding: 3px 5px;
  border-radius: 3px;
  background: #edeee5;
  color: #939989;
}
.category-tab[aria-pressed="true"] .tab-count {
  background: #e1e8db;
  color: #527049;
}
.results-count {
  font-size: 10px;
  white-space: nowrap;
  align-self: flex-start;
  padding-top: 3px;
  color: #959b8e;
}
.achievement-group {
  margin-bottom: 32px;
}
.group-heading {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 0 0 14px;
}
.group-icon {
  color: #929b7e;
  font-size: 18px;
  width: 22px;
  text-align: center;
}
.group-heading h3 {
  font-size: 13px;
  font-weight: 500;
  margin: 0;
  letter-spacing: 0.7px;
}
.group-description {
  color: #979d8e;
  font-size: 10px;
}
.group-progress {
  margin-left: auto;
  color: #919987;
  font-size: 10px;
}
.achievement-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 16px;
}
.achievement-card {
  position: relative;
  text-align: left;
  border: 1px solid #e2e4d9;
  background: #f0f1e9;
  border-radius: 7px;
  min-height: 211px;
  display: flex;
  flex-direction: column;
  padding: 18px 18px 17px;
  overflow: hidden;
  transition:
    transform 0.2s,
    box-shadow 0.2s,
    border-color 0.2s;
}
.achievement-card:hover {
  transform: translateY(-4px);
  border-color: #b6bea9;
  box-shadow: 0 8px 20px #213d3010;
}
.achievement-card.is-unlocked {
  background: #edf2e7;
  border-color: #bdcdb2;
}
.achievement-card.is-unlocked[data-category="royal"] {
  background: #f4f0e1;
  border-color: #d2c394;
}
.card-meta {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  font-size: 8px;
  letter-spacing: 1.1px;
  color: #949b8a;
}
.achievement-id {
  font-variant-numeric: tabular-nums;
}
.achievement-state {
  display: flex;
  align-items: center;
  gap: 4px;
  letter-spacing: 0.1px;
  font-size: 9px;
  color: #a0a69a;
}
.achievement-state svg {
  height: 11px;
  width: 11px;
}
.is-unlocked .achievement-state {
  color: #5a7d44;
}
.is-unlocked[data-category="royal"] .achievement-state {
  color: #9a803a;
}
.mini-fan {
  height: 100px;
  display: flex;
  align-items: center;
  justify-content: center;
  padding-top: 10px;
  margin: 6px 0 5px;
  perspective: 800px;
}
.mini-fan .playing-card {
  margin-left: -5px;
  transition: transform 0.3s;
}
.mini-fan .playing-card:first-child {
  margin-left: 0;
}
.is-locked .mini-fan {
  filter: grayscale(1);
  opacity: 0.52;
}
.is-locked .playing-card {
  background: #fcfcf7;
  border-color: #cdd1c4;
}
.achievement-card:hover .mini-fan .playing-card {
  transform: rotate(calc(var(--angle) * 1.2)) translateY(calc(var(--y) - 3px));
}
.achievement-bottom {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  margin-top: auto;
}
.achievement-name {
  display: block;
  margin: 0 0 6px;
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.2px;
}
.achievement-subtitle {
  display: block;
  margin: 0;
  font-size: 9px;
  color: #89937e;
  letter-spacing: 0.6px;
}
.is-locked .achievement-name {
  color: #77816e;
}
.achievement-arrow {
  font-size: 18px;
  font-family: var(--sans);
  color: #a4ad97;
}
.is-unlocked .achievement-arrow {
  color: #6b8156;
}
.is-locked .achievement-arrow {
  opacity: 0.5;
}

.site-footer {
  display: flex;
  align-items: center;
  gap: 24px;
  border-top: 1px solid var(--line);
  padding: 30px 0 36px;
}
.footer-brand {
  font-size: 28px;
  gap: 0;
  color: #798873;
}
.site-footer p {
  font-size: 10px;
  color: #9da391;
  margin: 0;
  letter-spacing: 0.5px;
}
.footer-suits {
  margin-left: auto;
  color: #aab29c;
  letter-spacing: 7px;
  font-size: 14px;
}
.footer-suits > span {
  color: var(--suit-color);
}
.empty-state {
  text-align: center;
  padding: 50px 20px 60px;
}
.empty-state[hidden] {
  display: none;
}
.empty-state > span {
  font: 60px var(--serif);
  color: #a0ae8f;
}
.empty-state h3 {
  font-weight: 500;
  font-size: 20px;
}
.empty-state p {
  font-size: 13px;
  color: var(--muted);
  line-height: 1.8;
}
.secondary-button {
  background: transparent;
  border: 1px solid #c6cebd;
  border-radius: 4px;
  padding: 10px 17px;
  margin-top: 12px;
  font-size: 12px;
}
/* The hand opens from a stacked deck, then settles into a shallow fan. */
dialog {
  width: min(850px, calc(100% - 40px));
  max-height: calc(100dvh - 48px);
  border: 1px solid #d3d9c8;
  border-radius: 14px;
  padding: 0;
  background: var(--page);
  color: var(--ink);
  box-shadow: 0 30px 100px #03180d66;
  overflow: auto;
}
dialog::backdrop {
  background: #0d221c99;
  backdrop-filter: blur(6px);
}
dialog[open] {
  animation: dialog-enter 0.28s cubic-bezier(0.2, 0.8, 0.2, 1);
}
body.dialog-open {
  overflow: hidden;
}
.detail-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 20px;
  padding: 29px 32px 22px;
}
.detail-eyebrow {
  font-size: 9px;
  letter-spacing: 2px;
  color: #8b947f;
  display: flex;
  align-items: center;
  gap: 7px;
}
.detail-eyebrow svg {
  height: 12px;
  width: 12px;
}
.detail-header h2 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: 30px;
  margin: 10px 0 8px;
}
.detail-header p {
  font-size: 12px;
  line-height: 1.8;
  color: #89917f;
  margin: 0;
}
.close-button {
  display: grid;
  place-items: center;
  background: #e9ede1;
  border-radius: 50%;
  width: 32px;

  justify-content: space-between;
  gap: 30px;
}
.range-page-header h1 {
  margin: 0;
  font: 400 39px/1.3 var(--serif);
  letter-spacing: 0.6px;
}
.range-assumptions {
  display: flex;
  align-items: center;
  flex-wrap: wrap;
  gap: 7px;
  justify-content: flex-end;
  max-width: 245px;
}
.range-assumptions > span {
  padding: 7px 10px;
  border: 1px solid #dce1d4;
  border-radius: 4px;
  font-size: 10px;
  color: #576c51;
  white-space: nowrap;
}
.range-assumptions small {
  width: 100%;
  text-align: right;
  font-size: 9px;
  letter-spacing: 1px;
  color: #929b88;
  margin-top: 4px;
}
.range-context {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 10px;
  margin-top: 29px;
  padding: 12px 15px;
  background: #e9eddf;
  border-radius: 5px;
  color: #5d7352;
}
.context-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: #778d62;
}
.preset-tag {
  margin-left: auto;
  border-left: 1px solid #cbd4bd;
  padding-left: 13px;
  font-size: 9px;
  letter-spacing: 0.5px;
  white-space: nowrap;
}
.range-controls {
  display: grid;
  grid-template-columns: 1fr 1.65fr;
  gap: 60px;
  padding: 29px 0;
  border-bottom: 1px solid var(--line);
  margin-bottom: 26px;
}
.range-control-label {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  margin-bottom: 12px;
  color: #637457;
}
.range-control-label > span {
  color: #a0a78f;
  font: 12px var(--serif);
}
.style-options {
  display: flex;
  padding: 4px;
  border: 1px solid #dfe3d5;
  border-radius: 6px;
  background: #eef0e7;
  gap: 4px;
}
.style-option {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  flex: 1;
  min-height: 40px;
  background: transparent;
  color: #7a866e;
  border-radius: 3px;
  font-size: 12px;
  transition:
    background 0.18s,
    color 0.18s;
}
.style-option small {
  font-size: 8px;
  color: #8c9780;
  letter-spacing: 0.6px;
}
.style-option[aria-pressed="true"] {
  background: #244b36;
  color: #fafbf1;
  box-shadow: 0 2px 5px #1837221a;
}
.style-option[aria-pressed="true"] small {
  color: #c5d1b8;
}
.position-options {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 7px;
}
.position-options button {
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 5px;
  padding: 7px 4px;
  min-height: 50px;
  background: transparent;
  border: 1px solid #dfe3d5;
  border-radius: 5px;
  color: #7f8b73;
  transition:
    background 0.18s,
    border-color 0.18s;
}
.position-options strong {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.4px;
}
.position-options small {
  font-size: 8px;
  white-space: nowrap;
}
.position-options button[aria-pressed="true"] {
  background: #e3eadb;
  border-color: #8ea67c;
  color: #355e34;
}
.position-options button:hover {
  border-color: #9aaa8d;
}
.range-workspace {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 26px;
  align-items: start;
}
.matrix-panel {
  min-width: 0;
  background: #fdfcf7;
  border: 1px solid #dce1d2;
  border-radius: 8px;
  padding: 23px 25px 19px;
}
.matrix-panel-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 22px;
}
.range-small-label {
  font-size: 9px;
  color: #7e8c71;
  letter-spacing: 0.8px;
}
.matrix-panel-header h2 {
  font: 400 23px var(--serif);
  margin: 8px 0 0;
  letter-spacing: 0.4px;
}
.matrix-percent {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 5px;
}
.matrix-percent strong {
  font: 400 32px/1 var(--serif);
  letter-spacing: -0.8px;
}
.matrix-percent > span {
  font-size: 9px;
  color: #8c9780;
}
.matrix-top-axis {
  display: grid;
  grid-template-columns: repeat(13, minmax(0, 1fr));
  margin-left: 21px;
  margin-bottom: 6px;
  text-align: center;
  font: 10px var(--sans);
  color: #89987b;
}
.matrix-body {
  display: flex;
  gap: 5px;
}
.matrix-side-axis {
  width: 16px;
  flex: 0 0 16px;
  display: grid;
  grid-template-rows: repeat(13, 1fr);
  align-items: center;
  font: 10px var(--sans);
  color: #89987b;
}
.hand-matrix {
  display: grid;
  grid-template-columns: repeat(13, minmax(0, 1fr));
  flex: 1;
  gap: 3px;
  min-width: 0;
}
.matrix-row {
  display: contents;
}
.matrix-cell {
  font: 500 11px/1 var(--sans);
  font-variant-numeric: tabular-nums;
  padding: 0;
  min-width: 0;
  aspect-ratio: 1.14;
  border-radius: 3px;
  display: grid;
  place-items: center;
  background: #eff0e8;
  color: #849079;
  box-shadow: inset 0 0 0 1px #e6e9dd;
  position: relative;
  transition:
    background 0.16s,
    box-shadow 0.16s;
}
.matrix-cell.is-raise {
  background: #426b4e;
  color: #fcfff2;
  box-shadow: inset 0 0 0 1px #2b553b1a;
}
.matrix-cell.is-pair {
  font-weight: 700;
}
.matrix-cell.is-raise.is-pair {
  background: #254b35;
}
.matrix-cell.is-pair::after {
  content: "";
  height: 2px;
  width: 2px;
  position: absolute;
  bottom: 5px;
  left: calc(50% - 1px);
  border-radius: 50%;
  background: currentColor;
  opacity: 0.5;
}
.matrix-cell[aria-selected="true"] {
  box-shadow:
    inset 0 0 0 2px #d0ad59,
    0 0 0 1px #b0904f;
  z-index: 1;
}
.matrix-cell:hover {
  box-shadow: inset 0 0 0 2px #b3be9e;
  z-index: 1;
}
.matrix-cell:focus-visible {
  outline: 2px solid #b6964d;
  outline-offset: 1px;
  z-index: 2;
}
.hand-matrix.is-inapplicable {
  opacity: 0.56;
}
.matrix-legend {
  display: flex;
  align-items: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 19px;
  padding-left: 21px;
  font-size: 9px;
  color: #76846a;
}
.matrix-legend > span {
  display: flex;
  align-items: center;
  gap: 5px;
}
.matrix-legend i {
  width: 9px;
  height: 9px;
  display: block;
  border-radius: 2px;
}
.legend-raise {
  background: #426b4e;
}
.legend-fold {
  background: #e8ecdf;
  border: 1px solid #dce2d1;
}
.legend-unavailable {
  border: 1px dashed #a4af96;
}
.legend-selected {
  border: 2px solid #c0a259;
}
.matrix-legend small {
  font-size: 9px;
  margin-left: auto;
  color: #8a957d;
}
.matrix-notation {
  margin: 16px 0 0 21px;
  font-size: 9px;
  color: #8d977f;
  line-height: 1.7;
}
.range-sidebar {
  display: grid;
  gap: 16px;
  min-width: 0;
}
.hand-inspector {
  background: #edf1e5;
  border: 1px solid #d4dfc8;
  border-radius: 8px;
  padding: 19px 20px;
}
.inspector-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}
.action-badge {
  font-size: 8px;
  border-radius: 3px;
  padding: 5px 7px;
  background: #e0e5d7;
  color: #75816b;
}
.action-badge.is-raise {
  color: #4c7040;
  background: #d8e5cb;
}
.inspector-hand {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-top: 16px;
  gap: 14px;
}
.inspector-hand h3 {
  font: 400 38px/1 var(--serif);
  letter-spacing: -0.8px;
  margin: 0 0 9px;
}
.inspector-hand p {
  margin: 0;
  font-size: 9px;
  line-height: 1.8;
  color: #87947a;
}
.inspector-hand p > span {
  margin: 0 3px;
  color: #b7c3a9;
}
.inspector-cards {
  display: flex;
  align-items: center;
  padding: 3px 5px 8px;
}
.inspector-cards .playing-card {
  --card-w: 47px;
  --card-h: 70px;
  margin-left: -3px;
  box-shadow: 0 3px 7px #2240301a;
}
.inspector-note {
  font-size: 10px;
  color: #76896a;
  line-height: 1.9;
  margin: 0;
}
.hand-combinations {
  border-top: 1px solid #d9e0cf;
  padding-top: 12px;
}
.hand-combinations summary {
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  color: #6e815f;
  font-size: 9px;
  list-style: none;
}
.hand-combinations summary::-webkit-details-marker {
  display: none;
}
.hand-combinations summary > span {
  font-size: 9px;
  display: flex;
  gap: 8px;
  align-items: center;
}
.hand-combinations summary > span:after {
  content: "+";
  font-size: 13px;
  color: #889a78;
}
.hand-combinations[open] summary > span:after {
  content: "−";
}
.combo-list {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 7px;
  margin-top: 13px;
}
.combo-pair {
  background: #f6f8ef;
  border: 1px solid #dce4d0;
  border-radius: 3px;
  padding: 7px 4px;
  text-align: center;
  font: 11px var(--serif);
  word-spacing: 3px;
}
.position-panel {
  border: 1px solid #dce1d2;
  border-radius: 8px;
  padding: 16px 20px 17px;
}
.position-panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
}
.position-panel-header > span:last-child {
  color: #939e86;
  font-size: 9px;
}
.position-table {
  position: relative;
  height: 170px;
  margin-top: 12px;
}
.position-felt {
  position: absolute;
  left: 16%;
  right: 16%;
  top: 25%;
  bottom: 25%;
  border-radius: 60px;
  background: #e8ecdf;
  border: 1px solid #cbd5bb;
  box-shadow:
    inset 0 0 0 5px #f7f7ef,
    inset 0 0 0 6px #dbe2cf;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 5px;
}
.position-felt > span {
  font: 20px var(--serif);
  color: #648357;
}
.position-felt > small {
  font-size: 8px;
  color: #8ca17a;
}
.table-seat {
  position: absolute;
  left: var(--seat-x);
  top: var(--seat-y);
  transform: translate(-50%, -50%);
  border: 1px solid #d9dfce;
  background: var(--page);
  color: #8d9a7e;
  font-size: 9px;
  width: 37px;
  height: 27px;
  border-radius: 5px;
}
.table-seat.is-active {
  background: #2d563c;
  color: #edf4e5;
  border-color: #2d563c;
}
.table-seat:hover {
  border-color: #78986c;
}
.dealer-chip {
  position: absolute;
  right: -9px;
  top: -8px;
  border: 1px solid #d1c392;
  background: #f5f1df;
  color: #98804a;
  font-size: 7px;
  line-height: 14px;
  text-align: center;
  height: 16px;
  width: 16px;
  border-radius: 50%;
}
.position-note {
  font-size: 10px;
  color: #8a957e;
  margin: 0;
  line-height: 1.85;
}
.range-comparison {
  padding: 3px 2px 0;
}
.range-comparison h3 {
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.3px;
  margin: 0 0 7px;
}
.range-comparison > p {
  font-size: 9px;
  color: #8a977d;
  line-height: 1.7;
  margin: 0 0 13px;
}
.comparison-row {
  display: flex;
  gap: 10px;
  align-items: center;
  width: 100%;
  background: transparent;
  border-radius: 3px;
  padding: 7px 4px;
  color: #8a967e;
  font-size: 9px;
}
.comparison-row > span:first-child {
  width: 47px;
  flex-shrink: 0;
  text-align: left;
}
.comparison-row > strong {
  width: 34px;
  text-align: right;
  font-weight: 400;
  font-size: 10px;
  font-variant-numeric: tabular-nums;
}
.comparison-track {
  background: #e7ebde;
  flex: 1;
  height: 5px;
  border-radius: 3px;
  overflow: hidden;
}
.comparison-track > span {
  display: block;
  height: 100%;
  border-radius: 3px;
  background: #b3c49f;
}
.comparison-row.is-selected {
  color: #365b36;
}
.comparison-row.is-selected .comparison-track > span {
  background: #567f48;
}
.comparison-row:hover {
  background: #edefe4;
}
.range-bottom {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 26px;
  margin-top: 27px;
}
.range-breakdown {
  border: 1px solid #dce1d2;
  border-radius: 6px;
  padding: 20px 22px;
}
.range-section-heading {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 14px;
}
.range-section-heading > span:last-child {
  font-size: 9px;
  color: #8b967f;
}
.breakdown-items {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  margin-top: 22px;
}
.breakdown-items > div {
  border-left: 1px solid #e0e5d7;
  padding-left: 21px;
}
.breakdown-items > div:first-child {
  border-left: 0;
  padding-left: 0;
}
.breakdown-items > div > span {
  display: block;
  font-size: 10px;
  color: #7c8b6f;
  margin-bottom: 8px;
}
.breakdown-items strong {
  display: block;
  font: 26px/1 var(--serif);
}
.breakdown-items strong small {
  font: 9px var(--sans);
  color: #9aa68d;
  margin-left: 5px;
}
.breakdown-items p {
  font-size: 9px;
  color: #9aa68d;
  margin: 10px 0 0;
}
.range-principles {
  background: #eef0e6;
  border-radius: 6px;
  padding: 22px 26px;
}
.range-principles h3 {
  font: 400 20px/1.4 var(--serif);
  margin: 12px 0 9px;
}
.range-principles p {
  font-size: 10px;
  line-height: 1.95;
  color: #819073;
  margin: 0;
}
.range-sources {
  margin-top: 25px;
  border-top: 1px solid var(--line);
}
.range-sources > summary {
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 19px 0 0;
  font-size: 10px;
  color: #7f8e71;
  list-style: none;
}
.range-sources > summary::-webkit-details-marker {
  display: none;
}
.range-sources > summary > span {
  font-size: 16px;
  color: #9ba88c;
}
.range-sources[open] > summary > span {
  transform: rotate(45deg);
}
.range-source-content {
  font-size: 10px;
  color: #7d8b6e;
  line-height: 1.95;
  padding-top: 12px;
  max-width: 100%;
}
.range-source-content p {
  margin: 0 0 8px;
}
.source-links {
  display: flex;
  flex-wrap: wrap;
  gap: 9px 25px;
  margin-top: 13px;
}
.source-links a {
  color: #5f7b50;
  text-decoration: underline;
  text-underline-offset: 4px;
}
.range-export {
  margin-top: 24px;
}
.range-export > div {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  margin-bottom: 8px;
}
.copy-range {
  background: #e6ecda;
  border: 1px solid #d3dfc3;
  border-radius: 3px;
  padding: 6px 11px;
  color: #59744c;
  font-size: 9px;
}
.range-export textarea {
  font: 11px/1.9 var(--sans);
  color: #79896a;
  width: 100%;
  padding: 10px 12px;
  background: #f1f3e9;
  border: 1px solid #dce3d1;
  border-radius: 4px;
  resize: vertical;
}
.range-export textarea:focus-visible {
  outline: 2px solid #b5a16b;
  outline-offset: 2px;
}
#copy-status {
  display: block;
  min-height: 18px;
  font-size: 9px;
}
.bb-explanation {
  background: #edf0e4;
  color: #6c7e5c;
  border-left: 2px solid #a3b28e;
  padding: 12px 14px;
  border-radius: 0 4px 4px 0;
  margin-bottom: 17px;
}
.bb-explanation strong {
  font-size: 12px;
  font-weight: 500;
}
.bb-explanation p {
  font-size: 10px;
  line-height: 1.8;
  margin: 6px 0 0;
}
.en .range-page-header h1 {
  font-size: 42px;
  letter-spacing: -0.5px;
}
.en .range-assumptions {
  max-width: 270px;
}
.en .style-option {
  gap: 7px;
  font-size: 11px;
}
.en .style-option small {
  font-size: 7px;
}
.en .comparison-row > span:first-child {
  width: 81px;
  font-size: 8px;
}
.en .range-controls {
  gap: 36px;
}
.en .matrix-legend {
  gap: 11px;
  font-size: 8px;
}
.en .matrix-legend small {
  font-size: 8px;
}
.en .range-principles h3 {
  font-size: 19px;
}

@media (min-width: 1500px) {
  .range-workspace {
    grid-template-columns: minmax(0, 1fr) 350px;
  }
  .matrix-cell {
    font-size: 12px;
  }
}
@media (max-width: 1100px) {
  .range-workspace {
    grid-template-columns: minmax(0, 1fr) 277px;
    gap: 20px;
  }
  .range-controls {
    gap: 30px;
    grid-template-columns: 1fr 1.55fr;
  }
  .matrix-panel {
    padding: 20px 18px 17px;
  }
  .matrix-cell {
    font-size: 10px;
    aspect-ratio: 1;
  }
  .hand-matrix {
    gap: 2px;
  }
  .matrix-cell.is-pair:after {
    bottom: 3px;
  }
  .matrix-legend {
    gap: 10px;
  }
  .matrix-legend small {
    width: 100%;
    margin-left: 0;
  }
  .hand-inspector {
    padding: 17px 17px;
  }
  .inspector-cards .playing-card {
    --card-w: 41px;
    --card-h: 63px;
  }
  .position-panel {
    padding: 17px;
  }
  .position-table {
    height: 152px;
  }
  .range-bottom {
    gap: 20px;
  }
  .en .style-option {
    flex-direction: column;
    gap: 4px;
    font-size: 10px;
  }
  .range-page-header h1,
  .en .range-page-header h1 {
    font-size: 34px;
  }
}
@media (max-width: 850px) {
  .range-workspace {
    grid-template-columns: minmax(0, 1fr);
  }
  .range-sidebar {
    grid-template-columns: 1fr 1fr;
    align-items: start;
    gap: 18px;
  }
  .range-comparison {
    grid-column: 1/-1;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    column-gap: 20px;
  }
  .range-comparison h3 {
    grid-column: 1/-1;
  }
  .range-comparison > p {
    grid-column: 1/-1;
  }
  .matrix-cell {
    font-size: 12px;
    aspect-ratio: 1.15;
  }
  .matrix-legend small {
    width: auto;
    margin-left: auto;
  }
  .hand-inspector {
    min-height: 249px;
  }
  .position-panel {
    min-height: 249px;
  }
  .position-table {
    height: 148px;
  }
  .range-page-header h1,
  .en .range-page-header h1 {
    font-size: 31px;
  }
  .range-page-header {
    gap: 18px;
  }
  .range-assumptions {
    max-width: 225px;
  }
  .range-assumptions > span {
    font-size: 9px;
    padding: 6px 8px;
  }
  .range-controls,
  .en .range-controls {
    grid-template-columns: 1fr;
    gap: 20px;
  }
  .style-options {
    max-width: 100%;
  }
  .en .style-option {
    flex-direction: row;
    gap: 9px;
    font-size: 11px;
  }
  .position-options {
    gap: 10px;
  }
  .position-options button {
    flex-direction: row;
    justify-content: center;
    gap: 7px;
    min-height: 41px;
  }
  .en .position-options button {
    flex-direction: column;
    gap: 4px;
  }
}
@media (max-width: 600px) {
  .site-header {
    display: grid;
    grid-template-columns: 1fr auto;
    height: auto;
    gap: 0;

.custom-select {
  position: relative;
  min-width: 0;
}
.select-trigger {
  width: 100%;
  min-width: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  min-height: 38px;
  padding: 9px 12px;
  background: #f8f9f1;
  color: #426039;
  border: 1px solid #d4ddc9;
  border-radius: 6px;
  font-size: 11px;
  text-align: left;
  transition:
    border-color 0.16s,
    background 0.16s,
    box-shadow 0.16s;
}
.select-trigger:hover {
  background: #f0f4e8;
  border-color: #b3c1a4;
}
.select-trigger[aria-expanded="true"] {
  background: #f8faf3;
  border-color: #96ae82;
  box-shadow: 0 1px 3px #254b3510;
}
.select-trigger:focus-visible {
  outline: 2px solid #809c6e;
  outline-offset: 2px;
}
.select-trigger:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.select-value {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.select-chevron {
  flex: 0 0 14px;
  display: grid;
  place-items: center;
  color: #7c906d;
  transition: transform 0.18s;
}
.select-chevron svg {
  width: 14px;
  height: 14px;
}
.select-trigger[aria-expanded="true"] .select-chevron {
  transform: rotate(180deg);
}
.language-picker .custom-select {
  min-width: 105px;
}
.language-picker .select-trigger {
  border-color: transparent;
  background: transparent;
  min-height: 34px;
  padding: 7px 8px;
  gap: 11px;
  font-size: 12px;
}
.language-picker .select-trigger:hover,
.language-picker .select-trigger[aria-expanded="true"] {
  background: #edf1e5;
  border-color: #e0e6d5;
  box-shadow: none;
}
.opponent-control .custom-select {
  min-width: 145px;
}
.select-menu {
  --entry-y: -3px;
  position: fixed;
  z-index: 100;
  box-sizing: border-box;
  padding: 5px;
  overflow-y: auto;
  overscroll-behavior: contain;
  scrollbar-width: thin;
  scrollbar-color: #c8d3bd transparent;
  background: #fcfdf7;
  border: 1px solid #d9e1ce;
  border-radius: 9px;
  box-shadow:
    0 10px 28px #23392316,
    0 2px 6px #23392309;
  font: 12px/1.4 var(--sans);
  color: #516849;
  animation: select-menu-enter 0.14s ease-out;
}
.select-menu[data-side="top"] {
  --entry-y: 3px;
}
.select-menu-option {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 15px;
  min-height: 37px;
  padding: 9px 11px;
  border-radius: 5px;
  cursor: pointer;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}
.select-menu-option + .select-menu-option {
  margin-top: 2px;
}
.select-menu-option.is-active {
  background: #f0f4e9;
  color: #2f5130;
}
.select-menu-option[aria-selected="true"] {
  background: #e8efdf;
  color: #345d31;
  font-weight: 500;
}
.select-menu-option[aria-selected="true"].is-active {
  background: #e1ebd6;
}
.select-menu-option[aria-disabled="true"] {
  opacity: 0.4;
  cursor: not-allowed;
}
.select-option-label {
  min-width: 0;
  overflow-wrap: anywhere;
}
.select-option-check {
  flex: 0 0 14px;
  opacity: 0;
  color: #62844e;
}
.select-option-check svg {
  width: 14px;
  height: 14px;
}
.select-menu-option[aria-selected="true"] .select-option-check {
  opacity: 1;
}
@keyframes select-menu-enter {
  from {
    opacity: 0;
    transform: translateY(var(--entry-y));
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}
@media (max-width: 600px) {
  .language-picker .custom-select {
    min-width: 99px;
  }
  .language-picker .select-trigger {
    font-size: 11px;
    padding-inline: 7px;
  }
  .opponent-control .custom-select {
    min-width: 136px;
  }
  .opponent-control .select-trigger {
    min-height: 35px;
    font-size: 10px;
    padding: 8px 10px;
  }
  .select-menu-option {
    min-height: 42px;
    padding: 11px;
  }
}
@media (prefers-reduced-motion: reduce) {
  .select-menu {
    animation: none;
  }
  .select-trigger,
  .select-chevron {
    transition: none;
  }
}

}
.odds-villain-toggle input {
  position: absolute;
  width: 29px;

.odds-toggle-track {

  height: 17px;

  height: 11px;

  left: 3px;
  background: #fdfef7;

      return `<section class="odds-distribution" aria-labelledby="distribution-heading"><div class="odds-panel-heading"><h2 id="distribution-heading">${t2("cResults")}</h2><div class="odds-sort" role="group" aria-label="${t2("cSort")}"><button type="button" data-odds-sort="probability" aria-pressed="${state.sort === "probability"}">${t2("cByProbability")}</button><button type="button" data-odds-sort="strength" aria-pressed="${state.sort === "strength"}">${t2("cByStrength")}</button></div></div>${result?.villain ? `<div class="distribution-players" role="group" aria-label="${t2("cCompare")}"><button type="button" data-distribution-player="hero" aria-pressed="${state.player === "hero"}">${t2("cHeroDistribution")}</button><button type="button" data-distribution-player="villain" aria-pressed="${state.player === "villain"}">${t2("cOpponentDistribution")}</button></div>` : ""}${result ? `<div class="odds-result-context"><span class="odds-exact-dot" aria-hidden="true"></span>${t2("cExact")}<span>\xB7</span>${t2("cTotalOutcomes", { count: result.totalOutcomes.toLocaleString() })}</div>` : `<div class="odds-empty"><span aria-hidden="true">\u2660</span><div><strong>${t2("cNoResults")}</strong><p>${readiness()}</p></div></div>`}<table class="odds-probability-table"><thead><tr><th scope="col">${t2("cCategory")}</th><th scope="col">${t2("cProbability")}</th><th scope="col">${t2("cOutcomes")}</th></tr></thead><tbody>${categories.map((category) => {
        const count = counts?.[category];
        const probability = result ? count / result.totalOutcomes : 0;
        return `<tr data-odds-category="${category}" data-probability="${probability}" class="${count === 0 ? "zero-probability" : ""}"><th scope="row"><span class="hand-strength-mark" aria-hidden="true">${String(ODDS_CATEGORIES.indexOf(category) + 1).padStart(2, "0")}</span>${t2(CATEGORY_KEYS[category])}</th><td><div class="probability-meter"><span aria-hidden="true" style="width:${probability * 100}%"></span><strong>${result ? percentage(probability) : "\u2014"}</strong></div></td><td>${result ? count.toLocaleString() : "\u2014"}</td></tr>`;
      }).join(
        ""
      )}</tbody>${result ? `<tfoot><tr><th scope="row">${t2("cPercentageTotal")}</th><td>100.00%</td><td>${result.totalOutcomes.toLocaleString()}</td></tr></tfoot>` : ""}</table><div class="odds-distribution-note"><span>${t2("cFinalHand")}</span><p>${t2("cDistributionNote")} ${t2("cRounding")}</p></div>${playerResult ? `<div class="current-hand"><div><span>${t2("cCurrentHand")}</span><strong>${t2(CATEGORY_KEYS[playerResult.current.category])}</strong></div><div class="current-hand-cards">${playerResult.current.bestCards.map((card2) => renderCard2(card2, { fan: false })).join("")}</div></div>` : ""}</section>`;
    }
    function closePicker() {
      const picker = element.querySelector(".card-picker");
      if (picker?.open) picker.close();
      document.body.classList.remove("card-picker-open");
    }
    function render(focusSelector) {
      closePicker();
      state.picker = null;
      element.innerHTML = `<header class="odds-page-header"><h1 id="odds-title">${t2("cTitle")}</h1><span>${t2("cFinalHand")}<i aria-hidden="true">\xB7</i>${t2("cExact")}</span></header><div class="odds-layout"><section class="odds-input-panel" aria-label="${t2("cKnownCards")}"><div class="odds-panel-heading"><h2>${t2("cHero")}</h2><button type="button" class="odds-text-button" data-odds-example>${t2("cExample")}</button></div>${slots("hero", 2)}<div class="odds-board-heading"><h2>${t2("cBoard")}</h2><div class="odds-stage" role="group" aria-label="${t2("cStage")}">${[3, 4, 5].map((stage) => `<button type="button" data-odds-stage="${stage}" aria-pressed="${state.stage === stage}">${t2({ 3: "cFlop", 4: "cTurn", 5: "cRiver" }[stage])}<span>${stage}</span></button>`).join("")}</div></div>${slots("board", state.stage)}<div class="odds-villain-heading"><h2>${t2("cVillain")}</h2><label class="odds-villain-toggle"><input type="checkbox" id="odds-use-villain" ${state.useVillain ? "checked" : ""}><span class="odds-toggle-track" aria-hidden="true"></span><span>${t2(state.useVillain ? "cHeadsUp" : "cAddVillain")}</span></label></div>${state.useVillain ? slots("villain", 2) : `<p class="odds-opponent-note">${t2("cNoOpponent")}</p>`}<div class="odds-form-actions"><button type="button" class="odds-calculate" data-odds-calculate ${!complete() || state.busy ? "disabled" : ""}>${t2(state.busy ? "cCalculating" : "cCalculate")}<span aria-hidden="true">${state.busy ? "\u2026" : "\u2197"}</span></button><button type="button" class="odds-reset" data-odds-reset>${t2("cReset")}</button></div><p class="odds-input-status${state.error ? " is-error" : ""}" role="status">${state.error ? t2("cError") : state.result ? t2("cResultStatus", { count: state.result.totalOutcomes.toLocaleString() }) : readiness()}</p><div class="odds-deck-count"><span>${t2("cKnownCards")} <strong>${knownCards().length}</strong></span><span>${t2("cRemainingCards", { count: 52 - knownCards().length })}</span></div></section><div class="odds-output" aria-busy="${state.busy}">${showdown()}${distribution()}</div></div><details class="odds-method"><summary>${t2("cMethod")}<span aria-hidden="true">+</span></summary><p>${t2("cCardRule")}</p><p>${t2("cMethodNote")}</p><a href="https://www.pokerstars.com/poker/learn/lesson/poker-hand-rankings/" target="_blank" rel="noopener noreferrer">${t2("cRankReference")} \u2197</a></details><p class="odds-live-region" aria-live="polite">${state.result ? t2("cResultStatus", { count: state.result.totalOutcomes.toLocaleString() }) : ""}</p><dialog class="card-picker" aria-labelledby="card-picker-title"><div class="card-picker-content"></div></dialog>`;
      const picker = element.querySelector(".card-picker");
      picker.addEventListener("close", () => {
        if (!picker.isConnected || !state.picker) return;
        document.body.classList.remove("card-picker-open");
        const slot = state.picker;
        state.picker = null;
        render(
          `[data-slot-group="${slot.group}"][data-slot-index="${slot.index}"]`
        );
      });
      let backdropStart = false;
      const outside = (event) => {
        const rect = picker.getBoundingClientRect();
        return event.target === picker && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom);
      };
      picker.addEventListener("pointerdown", (event) => {
        backdropStart = outside(event);
      });
      picker.addEventListener("pointerup", (event) => {
        if (backdropStart && outside(event)) closePicker();
        backdropStart = false;
      });
      if (focusSelector)
        element.querySelector(focusSelector)?.focus({ preventScroll: true });
    }
    function renderPicker() {
      if (!state.picker) return;
      const { group, index } = state.picker;
      const current = state[group][index];
      const used = new Set(knownCards().map(keyOf));
      if (current) used.delete(keyOf(current));
      element.querySelector(".card-picker-content").innerHTML = `<header class="card-picker-header"><div><h2 id="card-picker-title">${t2("cPickTitle")}</h2><p>${t2("cPickerFor", { target: groupLabel(group), index: index + 1 })}</p></div><button type="button" class="card-picker-close" data-picker-close aria-label="${t2("cClose")}">\xD7</button></header><div class="picker-suit-filters" role="group" aria-label="${t2("cAllSuits")}"><button type="button" data-picker-suit="all" aria-pressed="${state.pickerSuit === "all"}">${t2("cAllSuits")}</button>${PICKER_SUITS.map((suit) => `<button type="button" class="suit-${suit.id}" data-picker-suit="${suit.id}" aria-pressed="${state.pickerSuit === suit.id}" aria-label="${t2(suit.label)}">${suit.symbol}</button>`).join("")}</div><div class="card-picker-deck">${PICKER_SUITS.filter(
        (suit) => state.pickerSuit === "all" || state.pickerSuit === suit.id
      ).map(
        (suit) => `<section class="picker-suit-group"><h3 class="suit-${suit.id}">${suit.symbol}<span>${t2(suit.label)}</span></h3><div class="picker-card-grid">${PICKER_RANKS.map(
          (rank) => {
            const card2 = { rank, suit: suit.id }, key = keyOf(card2), unavailable = used.has(key), selected = current && keyOf(current) === key;
            const label = unavailable ? t2("cUsedCard", { card: cardName(card2) }) : cardName(card2);
            return `<button type="button" class="picker-card${selected ? " is-selected" : ""}" data-pick-card="${key}" ${unavailable ? "disabled" : ""} aria-label="${escape(label)}" aria-pressed="${Boolean(selected)}">${renderCard2(card2, { fan: false })}</button>`;
          }
        ).join("")}</div></section>`
      ).join(
        ""
      )}</div><footer class="card-picker-footer"><span>${t2("cPickerHint")}</span><button type="button" data-picker-clear ${!current ? "disabled" : ""}>${t2("cClearCard")}</button></footer>`;
    }
    function openPicker(group, index) {
      state.picker = { group, index, advance: !state[group][index] };
      state.pickerSuit = "all";
      renderPicker();
      element.querySelector(".card-picker").showModal();
      document.body.classList.add("card-picker-open");
    }
    function chooseCard(key) {
      const card2 = deckByKey.get(key);
      if (!card2 || !state.picker) return;
      const { group, index, advance } = state.picker;
      const current = state[group][index];
      if (knownCards().some((known) => keyOf(known) === key) && (!current || keyOf(current) !== key))
        return;
      if (current && keyOf(current) === key) {
        closePicker();
        return;
      }
      state[group][index] = { ...card2 };
      invalidate();
      const count = group === "board" ? state.stage : 2;
      const next = state[group].findIndex(
        (value, nextIndex) => nextIndex > index && nextIndex < count && !value
      );
      if (advance && next >= 0) {
        state.picker.index = next;
        renderPicker();
        element.querySelector(".card-picker-close").focus({ preventScroll: true });
      } else closePicker();
    }
    async function calculate() {
      if (!complete() || state.busy) return;
      const version = ++state.version;
      const input = {
        hero: state.hero.map((card2) => ({ ...card2 })),
        board: state.board.slice(0, state.stage).map((card2) => ({ ...card2 })),
        villain: state.useVillain ? state.villain.map((card2) => ({ ...card2 })) : null
      };
      state.busy = true;
      state.error = false;
      render();
      await new Promise((resolve) => setTimeout(resolve, 0));
      if (version !== state.version) return;
      try {
        state.result = calculateOdds(input);
      } catch {
        state.result = null;
        state.error = true;
      }
      if (version !== state.version) return;
      state.busy = false;
      render("[data-odds-calculate]");
    }
    element.addEventListener("change", (event) => {
      if (event.target.id !== "odds-use-villain") return;
      state.useVillain = event.target.checked;
      if (!state.useVillain) {
        state.villain = emptyCards(2);
        state.player = "hero";
      }
      invalidate();
      render("#odds-use-villain");
    });
    element.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button || button.disabled) return;
      if (button.dataset.slotGroup)
        openPicker(button.dataset.slotGroup, Number(button.dataset.slotIndex));
      else if (button.dataset.pickCard) chooseCard(button.dataset.pickCard);
      else if (button.dataset.pickerSuit) {
        state.pickerSuit = button.dataset.pickerSuit;
        renderPicker();
        element.querySelector(`[data-picker-suit="${state.pickerSuit}"]`).focus();
      } else if (button.hasAttribute("data-picker-close")) closePicker();
      else if (button.hasAttribute("data-picker-clear")) {
        state[state.picker.group][state.picker.index] = null;
        invalidate();
        closePicker();
      } else if (button.dataset.oddsStage) {
        if (state.stage === Number(button.dataset.oddsStage)) return;
        state.stage = Number(button.dataset.oddsStage);
        for (let index = state.stage; index < 5; index++)
          state.board[index] = null;
        invalidate();
        render(`[data-odds-stage="${state.stage}"]`);
      } else if (button.dataset.oddsSort) {
        state.sort = button.dataset.oddsSort;
        render(`[data-odds-sort="${state.sort}"]`);
      } else if (button.dataset.distributionPlayer) {
        state.player = button.dataset.distributionPlayer;
        render(`[data-distribution-player="${state.player}"]`);
      } else if (button.hasAttribute("data-odds-calculate")) calculate();
      else if (button.hasAttribute("data-odds-reset")) {
        state.hero = emptyCards(2);
        state.board = emptyCards(5);
        state.villain = emptyCards(2);
        state.stage = 3;
        state.useVillain = false;
        state.player = "hero";
        invalidate();
        render("[data-odds-reset]");
      } else if (button.hasAttribute("data-odds-example")) {
        state.hero = [
          { rank: "A", suit: "spades" },
          { rank: "K", suit: "spades" }
        ];
        state.board = [
          { rank: "Q", suit: "spades" },
          { rank: "J", suit: "spades" },
          { rank: "2", suit: "diamonds" },
          null,
          null
        ];
        state.villain = emptyCards(2);
        state.stage = 3;
        state.useVillain = false;
        state.player = "hero";
        invalidate();
        render();
        calculate();
      }
    });
    element.addEventListener("keydown", (event) => {
      const picker = element.querySelector(".card-picker");
      if (!picker?.open || event.key !== "Tab") return;
      const buttons = [...picker.querySelectorAll("button:not([disabled])")];
      const first = buttons[0], last = buttons.at(-1);
      if (event.shiftKey && document.activeElement === first) {
        event.preventDefault();
        last.focus();
      } else if (!event.shiftKey && document.activeElement === last) {
        event.preventDefault();
        first.focus();
      }
    });
    return { render, closePicker };
  }

  var SUITS2 = Object.freeze([
    Object.freeze({ id: "spades", symbol: "\u2660" }),
    Object.freeze({ id: "hearts", symbol: "\u2665" }),
    Object.freeze({ id: "clubs", symbol: "\u2663" }),
    Object.freeze({ id: "diamonds", symbol: "\u2666" })
  ]);
  var SUIT_IDS = new Set(SUITS2.map(({ id }) => id));
  var FACE_RANKS = { 11: "J", 12: "Q", 13: "K", 14: "A" };
  function rankLabel(rank) {
    if (!Number.isInteger(rank) || rank < 2 || rank > 14) {
      throw new RangeError("A card rank must be an integer from 2 to 14.");
    }
    return FACE_RANKS[rank] ?? String(rank);
  }
  var RANKS2 = new Set(
    Array.from({ length: 13 }, (_, index) => rankLabel(index + 2))
  );
  var card = (rank, suit) => ({
    rank: typeof rank === "number" ? rankLabel(rank) : rank,
    suit
  });
  var cardKey = ({ rank, suit }) => `${rank}:${suit}`;
  var isCard = (value) => value !== null && typeof value === "object" && RANKS2.has(value.rank) && SUIT_IDS.has(value.suit);
  function targetCards(achievement) {
    if (!achievement || !Number.isInteger(achievement.high)) return null;
    const { category, high, suit } = achievement;
    if (category === "quads") {
      if (high < 10 || high > 14 || suit !== null) return null;
      return SUITS2.map(({ id }) => card(high, id));
    }
    if (!SUIT_IDS.has(suit)) return null;
    if (category === "royal" && high !== 14) return null;
    if (category === "straight-flush" && (high < 10 || high > 13)) return null;
    if (category !== "royal" && category !== "straight-flush") return null;
    return Array.from({ length: 5 }, (_, index) => card(high - 4 + index, suit));
  }
  function validateRecord(achievement, record) {
    const target = targetCards(achievement);
    if (!target || !Array.isArray(achievement.cards) || achievement.cards.length !== target.length || !achievement.cards.every(isCard))
      return false;
    const declaredKeys = new Set(achievement.cards.map(cardKey));
    if (declaredKeys.size !== target.length || !target.every((value) => declaredKeys.has(cardKey(value))))
      return false;
    if (!record || !Array.isArray(record.hole) || record.hole.length !== 2 || !Array.isArray(record.board) || record.board.length !== 5)
      return false;
    const sevenCards = [...record.hole, ...record.board];
    if (!sevenCards.every(isCard)) return false;
    const sevenKeys = new Set(sevenCards.map(cardKey));
    return sevenKeys.size === 7 && target.every((value) => sevenKeys.has(cardKey(value)));
  }
  var RECORDS = {
    "royal-diamonds": {
      hole: [card("A", "diamonds"), card("K", "diamonds")],
      board: [
        card("10", "diamonds"),
        card("Q", "diamonds"),
        card("10", "clubs"),
        card("J", "diamonds"),
        card("8", "clubs")
      ]
    },
    "straight-flush-spades-12": {
      hole: [card("10", "spades"), card("8", "spades")],
      board: [
        card("9", "spades"),
        card("Q", "spades"),
        card("J", "spades"),
        card("9", "hearts"),
        card("8", "diamonds")
      ]
    },
    "quads-13": {
      hole: [card("K", "hearts"), card("4", "diamonds")],
      board: [
        card("K", "diamonds"),
        card("K", "clubs"),
        card("K", "spades"),
        card("6", "spades"),
        card("J", "spades")
      ]
    }
  };
  function createAchievement(category, high, suit = null) {
    const id = category === "quads" ? `quads-${high}` : category === "royal" ? `royal-${suit}` : `straight-flush-${suit}-${high}`;
    const achievement = { id, category, high, suit };
    achievement.cards = targetCards(achievement);
    const record = RECORDS[id] ?? null;
    achievement.record = validateRecord(achievement, record) ? record : null;
    return achievement;
  }
  var ACHIEVEMENTS = [
    ...SUITS2.map(({ id }) => createAchievement("royal", 14, id)),
    ...[13, 12, 11, 10].flatMap(
      (high) => SUITS2.map(({ id }) => createAchievement("straight-flush", high, id))
    ),
    ...[14, 13, 12, 11, 10].map((high) => createAchievement("quads", high))
  ];
  function getStats(achievements = ACHIEVEMENTS) {
    const byCategory = Object.fromEntries(
      ["royal", "straight-flush", "quads"].map((category) => [
        category,
        { total: 0, unlocked: 0, remaining: 0 }
      ])
    );
    let unlocked = 0;
    for (const achievement of achievements) {
      const category = byCategory[achievement.category];
      const achieved = validateRecord(achievement, achievement.record);
      if (achieved) unlocked += 1;
      if (category) {
        category.total += 1;
        category.unlocked += Number(achieved);
        category.remaining += Number(!achieved);
      }
    }
    return {
      total: achievements.length,
      unlocked,
      remaining: achievements.length - unlocked,
      byCategory
    };
  }

      renderDetail(ACHIEVEMENTS.find(({ id }) => id === uiState.openAchievement));
    try {
      localStorage.setItem("holdem.language", language);
    } catch {
    }
  }
  $("#language").addEventListener(
    "change",
    (event) => setLanguage(event.target.value)
  );
  $("#category-tabs").addEventListener("click", (event) => {
    const tab = event.target.closest("[data-category]");
    if (!tab) return;
    uiState.category = tab.dataset.category;
    renderGroups();
  });
  $("#unlocked-only").addEventListener("change", (event) => {
    uiState.onlyUnlocked = event.target.checked;
    renderGroups();
  });
  $("#reset-filters").addEventListener("click", () => {
    uiState.category = "all";
    uiState.onlyUnlocked = false;
    renderGroups();
  });
  $("#achievement-groups").addEventListener("click", (event) => {
    const button = event.target.closest("[data-achievement]");
    if (button) openAchievement(button.dataset.achievement);
  });
  $("#hero-achievement").addEventListener(
    "click",
    () => openAchievement("royal-diamonds")
  );
  dialog.addEventListener("click", (event) => {
    if (event.target.closest("[data-close-dialog]")) dialog.close();
    if (event.target.closest("[data-replay]")) {
      for (const animation of dialog.getAnimations({ subtree: true })) {
        if (animation.animationName === "deal-card") {
          animation.cancel();
          animation.play();
        }
      }
    }
  });
  var pointerStartedOnBackdrop = false;
  dialog.addEventListener("pointerdown", (event) => {
    const rect = dialog.getBoundingClientRect();
    pointerStartedOnBackdrop = event.target === dialog && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom);
  });
  dialog.addEventListener("pointerup", (event) => {
    const rect = dialog.getBoundingClientRect();
    if (pointerStartedOnBackdrop && event.target === dialog && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom))
      dialog.close();
    pointerStartedOnBackdrop = false;
  });
  dialog.addEventListener("keydown", (event) => {
    if (event.key !== "Tab") return;
    const buttons = [...dialog.querySelectorAll("button:not([disabled])")];
    const first = buttons[0];
    const last = buttons.at(-1);
    if (!first) return;
    if (event.shiftKey && document.activeElement === first) {
      event.preventDefault();
      last.focus();
    } else if (!event.shiftKey && document.activeElement === last) {
      event.preventDefault();
      first.focus();
    }
  });
  dialog.addEventListener("close", () => {
    uiState.openAchievement = null;
    document.body.classList.remove("dialog-open");
  });
  function syncView() {
    const previousView = uiState.view;
    if (location.hash === "#ranges") uiState.view = "ranges";
    else if (location.hash === "#odds") uiState.view = "odds";
    else if (["", "#", "#collection"].includes(location.hash))
      uiState.view = "achievements";
    if (previousView !== uiState.view) {
      if (dialog.open) dialog.close();
      oddsCalculator.closePicker();
    }
    $("#achievements-view").hidden = uiState.view !== "achievements";
    $("#ranges-view").hidden = uiState.view !== "ranges";
    $("#odds-view").hidden = uiState.view !== "odds";
    document.querySelectorAll("[data-view]").forEach((link) => {
      const selected = link.dataset.view === uiState.view;
      link.classList.toggle("active", selected);
      if (selected) link.setAttribute("aria-current", "page");
      else link.removeAttribute("aria-current");
    });
    document.title = t(titleKey());
    if (previousView !== uiState.view)
      window.scrollTo({ top: 0, behavior: "instant" });
  }
  window.addEventListener("hashchange", syncView);
  $(".skip-link").addEventListener("click", (event) => {
    event.preventDefault();
    const main = $("#main-content");
    main.tabIndex = -1;
    main.focus({ preventScroll: true });
    main.scrollIntoView({ behavior: "instant" });
  });
  setLanguage(uiState.language);
  syncView();
})();

    </script>
  </body>
</html>
