          <h3 class="example-question">后位适合开池的 <span class="cash-inline-hand" role="img" aria-label="A7，花色未指定"><b>A7</b><span class="cash-hand-cards"><i class="playing-card rank-only">A</i><i class="playing-card rank-only">7</i></span></span> 同花，也适合接小盲的再加注吗？</h3>
          <p class="example-given">在这个局面中，把小盲的再加注范围估得很紧。</p>
          <details class="example-answer"><summary>看判断与计算</summary>
          <dl class="example-amounts"><div><dt>补入成本</dt><dd>525</dd></div><div><dt>跟注后底池</dt><dd>1,450</dd></div><div><dt>跟注后你的后手</dt><dd>4,100</dd></div></dl>
          <p class="example-decision"><strong>实战弃牌。</strong>首入时有直接拿走盲注的机会。现在对方主动把总价提到 14 BB，<span class="cash-inline-hand" role="img" aria-label="A7，花色未指定"><b>A7</b><span class="cash-hand-cards"><i class="playing-card rank-only">A</i><i class="playing-card rank-only">7</i></span></span> 的高牌优势面对这批牌会大幅缩水，中了顶对也可能被更好的 A 压制。付 525 的直接门槛是 525 ÷ 1,450 ≈ 36.2%，还要考虑翻牌后的投入；原先投入的 175 不构成继续的理由。</p>

        <p class="replay-line" data-at="preflop"><strong>翻牌前</strong> · 九人桌，盲注 5/10。你有 830，最先行动。第三位有 1,260，爱便宜看牌；按钮前位有 720，打得偏紧。</p><p class="replay-line" data-at="flop"><strong>翻牌</strong> · 原局你开到 30，敏敏和尖尖各跟 30，两盲和其他人弃牌。底池 105。你击中两底对，下注 70，两人都弃。未被跟的 70 退回。</p>
        <div class="street-review" data-at="flop"><details class="example-answer"><summary>击中两底对，应当直接下注还是等过牌加注？</summary><p>若有人会用不少牌下注，过牌加注才有价值。这里你是翻前加注者，一名跟注者偏紧；三个人都过牌的可能并不小。两底对还会被反超，先下 70 可以立刻向顶对和听牌收费。</p></details></div>

          <p class="example-decision"><strong>一般可以弃；只有桌况支持，才让它偶尔随强牌一起加注。</strong>枪口位身后还有八人。若多人会跟或再加，<span class="cash-inline-hand" role="img" aria-label="54s，示意 5♠ 4♠"><b>54s</b><span class="cash-hand-cards"><i class="playing-card suit-spades" data-card="5:spades">5<em>♠</em></i><i class="playing-card suit-spades" data-card="4:spades">4<em>♠</em></i></span></span> 常要在不利位置用较弱的牌继续。书中让它偶尔从前位加注，目的是让自己的开池范围在部分低牌面上也有强牌组合。同花连牌种类多，全部都开，就失去了“少量搭配”的条件。</p>
