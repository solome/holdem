<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f6f0">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="Holdem">
    <meta name="description" content="皇家同花顺、同花顺与四条金刚的个人成就图鉴。">
    <title>Holdem — 掬一捧的德州好牌图鉴</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="icon" href="assets/brand/favicon.ico" sizes="16x16 32x32 48x48">
    <link rel="icon" href="assets/brand/logo.svg" type="image/svg+xml" sizes="any">
    <link rel="apple-touch-icon" href="assets/brand/apple-touch-icon.png" sizes="180x180">
    <script>// Resolve bookmarks from the old single-page site before loading the homepage.
function redirectOldBookmark() {
  const match = /^#(ranges|odds|review|handbook|tilt|reading)(?:\/([a-z0-9-]+))?$/.exec(location.hash);
  if (match) location.replace(match[1] + ".html" + location.search + (match[2] ? "#" + match[1] + "-" + match[2] : ""));
}
redirectOldBookmark();
window.addEventListener("hashchange", redirectOldBookmark);
</script>
    <link rel="stylesheet" href="assets/build/styles.css">
    <link rel="stylesheet" href="assets/build/select-menu.css">
    <link rel="stylesheet" href="assets/build/review-menu.css">
    <link rel="stylesheet" href="assets/build/achievements.css">
    <script defer src="assets/build/achievements.js"></script>
  </head>
  <body data-view="achievements" data-title="pageTitle">
    <a class="skip-link" href="#main-content" data-i18n="skip">跳至主要内容</a>
    <header class="site-header wrap">
      <a class="brand" href="index.html" aria-label="Holdem"><img class="brand-mark" src="assets/brand/logo.svg" width="32" height="32" alt=""><span>Holdem<span class="brand-period">.</span></span></a>
      <nav class="header-nav" aria-label="导航" data-i18n-aria="navigation">
        <a href="index.html" class="nav-link active" data-i18n="collection" aria-current="page">成就图鉴</a>
<details class="review-nav-menu" id="study-nav-menu" name="site-navigation">
      <summary class="nav-link review-nav-trigger"><span data-i18n="studyMenu">学习</span><svg viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="review-nav-links"><a href="ranges.html" class="" data-i18n="mNav">起手牌矩阵</a><a href="cash.html" class="" data-i18n="cashNav">无限注现金桌</a></div></details>
<details class="review-nav-menu" id="review-nav-menu" name="site-navigation">
      <summary class="nav-link review-nav-trigger"><span data-i18n="reviewMenu">复盘</span><svg viewBox="0 0 16 16" width="16" height="16" fill="none" aria-hidden="true"><path d="m4 6 4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg></summary>
      <div class="review-nav-links"><a href="review.html" class="" data-i18n="rNav">牌局复盘</a><a href="handbook.html" class="" data-i18n="hNav">松凶手册</a><a href="tilt.html" class="" data-i18n="tNav">情绪管理</a><a href="reading.html" class="" data-i18n="oNav">读人识牌</a></div></details>
<a href="odds.html" class="nav-link " data-i18n="cNav">牌力计算</a>
      </nav>
      <div class="language-picker">
        <span class="language-icon" aria-hidden="true">文<span>A</span></span>
        <select id="language" aria-label="选择语言" data-i18n-aria="language" data-menu-align="end">
          <option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="en">English</option>
        </select>
      </div>
    </header>
    <main class="wrap" id="main-content" tabindex="-1">
            <div id="achievements-view">
        <section class="hero" aria-labelledby="hero-title">
          <div class="hero-copy">
            <h1 id="hero-title" data-i18n="heroTitle">
              好牌，值得<br /><span>被记住。</span>
            </h1>
            <p data-i18n="heroDescription">
              有些牌，千载难逢。<br />把牌桌上的高光时刻，收藏在这里。
            </p>
            <a class="primary-button" href="#collection"
              ><span data-i18n="explore">探索我的成就</span
              ><span aria-hidden="true">↗</span></a
            >
          </div>
          <button
            class="hero-table"
            id="hero-achievement"
            type="button"
            aria-label="查看方片皇家同花顺"
            data-i18n-aria="heroAria"
          >
            <span class="table-inner" aria-hidden="true"></span>
            <span class="table-corner corner-top" aria-hidden="true"
              >A<br />♦</span
            ><span class="table-corner corner-bottom" aria-hidden="true"
              >A<br />♦</span
            >
            <span class="table-eyebrow"
              ><span aria-hidden="true">✦</span>
              <span data-i18n="personalBest">个人最高成就</span>
              <span aria-hidden="true">✦</span></span
            >
            <span class="hero-fan" id="hero-fan" aria-hidden="true"></span>
            <span class="table-caption"
              ><span class="hero-achievement-name" id="hero-name"
                >方片皇家同花顺</span
              ><span class="table-subtitle" id="hero-date"></span
              ></span
            >
            <span class="hero-open" aria-hidden="true">↗</span>
          </button>
        </section>

        <section
          class="stats"
          aria-label="成就统计"
          data-i18n-aria="statistics"
        >
          <div class="stat stat-total">
            <div class="progress-ring" id="progress-ring">
              <span>12<small>%</small></span>
            </div>
            <div>
              <div class="stat-label" data-i18n="totalProgress">收藏进度</div>
              <div class="stat-value">
                <span id="total-count">04</span
                ><span class="stat-denominator"> / 33</span>
              </div>
            </div>
          </div>
          <div class="stat">
            <span class="stat-symbol" aria-hidden="true">♛</span>
            <div>
              <div class="stat-label" data-i18n="royal">皇家同花顺</div>
              <div class="stat-value" id="royal-count">
                01<span class="stat-denominator"> / 04</span>
              </div>
            </div>
          </div>
          <div class="stat">
            <span class="stat-symbol flush-symbol" aria-hidden="true">♠</span>
            <div>
              <div class="stat-label" data-i18n="straightFlush">同花顺</div>
              <div class="stat-value" id="flush-count">
                01<span class="stat-denominator"> / 16</span>
              </div>
            </div>
          </div>
          <div class="stat">
            <span class="stat-symbol quads-symbol" aria-hidden="true"
              >4<span>♣</span></span
            >
            <div>
              <div class="stat-label" data-i18n="quads">四条金刚</div>
              <div class="stat-value" id="quads-count">
                02<span class="stat-denominator"> / 13</span>
              </div>
            </div>
          </div>
        </section>

        <section
          class="collection"
          id="collection"
          aria-labelledby="collection-title"
        >
          <div class="collection-heading">
            <div>
              <h2 id="collection-title" data-i18n="collectionTitle">
                把传奇，一手手集齐。
              </h2>
            </div>
            <label class="unlocked-toggle"
              ><input type="checkbox" id="unlocked-only" /><span
                class="switch"
                aria-hidden="true"
              ></span
              ><span data-i18n="onlyUnlocked">只看已达成</span></label
            >
          </div>
          <div class="collection-toolbar">
            <div
              class="category-tabs"
              role="group"
              aria-label="牌型筛选"
              data-i18n-aria="categoryFilter"
              id="category-tabs"
            ></div>
            <span
              class="results-count"
              id="results-count"
              role="status"
              aria-live="polite"
            ></span>
          </div>
          <div id="achievement-groups"></div>
          <div class="empty-state" id="empty-state" hidden>
            <span aria-hidden="true">♧</span>
            <h3 data-i18n="emptyTitle">暂无已达成成就</h3>
            <button
              id="reset-filters"
              class="secondary-button"
              type="button"
              data-i18n="showAll"
            >
              查看全部
            </button>
          </div>
        </section>
      </div>
    <dialog
      id="achievement-dialog"
      aria-labelledby="detail-title"
    >
      <div id="dialog-content"></div>
    </dialog>
<noscript><p>请开启 JavaScript 以使用此工具。</p></noscript>
    </main>
    <footer class="site-footer wrap">
      <a class="brand footer-brand" href="index.html">Holdem<span class="brand-period">.</span></a>
      <p id="footer-copy" data-i18n="footer"></p>
      <span class="footer-suits" aria-hidden="true"><span class="suit-spades">♠</span> <span class="suit-hearts">♥</span> <span class="suit-clubs">♣</span> <span class="suit-diamonds">♦</span></span>
    </footer>
  </body>
</html>
