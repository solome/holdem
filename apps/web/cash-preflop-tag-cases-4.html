      <div class="replay-notes">
        <p class="replay-line" data-at="preflop"><strong>翻牌前</strong> · 九人桌，盲注 5/10。其余人都弃到你，你有 1,200，大盲有 1,800。这是本桌你们第一次只剩两盲交手。<span class="cash-inline-hand" role="img" aria-label="A9o，示意 A♠ 9♥"><b>A9o</b><span class="cash-hand-cards"><i class="playing-card suit-spades" data-card="A:spades">A<em>♠</em></i><i class="playing-card suit-hearts" data-card="9:hearts">9<em>♥</em></i></span></span> 可以率先加注，原局你补 5 到 10，旺旺过牌。</p><p class="replay-line" data-at="flop"><strong>翻牌</strong> · 你只有 A 高，选择过牌，原计划若对方下注可以跟一轮。旺旺也过牌。此时大盲可以拿着比你差的高牌，也可以用弱成牌控池。</p><p class="replay-line" data-at="turn"><strong>转牌</strong> · 4♠ 没有给你配对。你再过牌，旺旺也过牌，两人都没有往底池加钱。</p><p class="replay-line" data-at="river"><strong>河牌</strong> · 9♠ 让你得到一对 9，现在你先行动。</p>
        <div class="street-review" data-at="preflop"><details class="example-answer"><summary>小盲补齐只是为了省半个盲注吗？</summary><p>这手 <span class="cash-inline-hand" role="img" aria-label="A9o，示意 A♠ 9♥"><b>A9o</b><span class="cash-hand-cards"><i class="playing-card suit-spades" data-card="A:spades">A<em>♠</em></i><i class="playing-card suit-hearts" data-card="9:hearts">9<em>♥</em></i></span></span> 可以直接加注偷盲。原局选择补齐，若对手再加注还可以按尺寸跟进。当同桌第一次看到你在小盲补齐时，你也有机会让他们记住：补齐的范围里包含有摊牌价值的牌。</p></details></div>
        <div class="replay-analysis" data-at="river">
          <h3 class="example-question">河牌配到一对 9，主动下小注还是过牌？</h3>
          <p class="example-given">题设中的大盲此前表现谨慎。这是你们首次在这桌单独交手，你希望对方以后看到你补齐或过牌时，也得考虑你手里可能有成牌。</p>
          <details class="example-answer"><summary>看判断与计算</summary>
          <dl class="example-amounts"><div><dt>翻牌底池</dt><dd>20</dd></div><div><dt>河牌底池</dt><dd>20</dd></div><div><dt>过牌的投入</dt><dd>0</dd></div></dl>
          <p class="example-decision"><strong>可以过牌，让对手用没中的牌尝试诈唬。</strong>翻牌前补齐使大盲保留大量边缘手牌；连续两轮过牌，也没有排除一对 7 或较弱的对子。若这位对手会用这些牌跟小注却很少自己下注，下注收薄价值也有根据。若他常在别人示弱后尝试偷池，过牌给他主动下注的机会。打到这一刻，仍不能把他两次过牌直接读成没牌。</p>
          </details></div>
        <details class="example-showdown" data-at="river"><summary>看旺旺的摊牌</summary><div><div class="replay-cards" role="group" aria-label="旺旺的手牌"><span class="playing-card suit-hearts royal-card" style="--angle:0deg;--y:0px;--deal-index:0;--deal-offset:18" role="img" aria-label="红桃 Q" data-card="Q:hearts"><span class="card-corner" aria-hidden="true">Q<span class="corner-suit">♥</span></span><span class="card-pip" aria-hidden="true">♥</span><span class="card-corner bottom" aria-hidden="true">Q<span class="corner-suit">♥</span></span></span><span class="playing-card suit-clubs" style="--angle:0deg;--y:0px;--deal-index:1;--deal-offset:-18" role="img" aria-label="梅花 7" data-card="7:clubs"><span class="card-corner" aria-hidden="true">7<span class="corner-suit">♣</span></span><span class="card-pip" aria-hidden="true">♣</span><span class="card-corner bottom" aria-hidden="true">7<span class="corner-suit">♣</span></span></span></div><p>原局你和旺旺都过牌。旺旺翻牌就有一对 7，河牌被你的一对 9 超过，你赢下 20。</p></div></details>

          <h3 class="example-question">投入 8 可以争眼前的 54，这张不同花弱 A 就值得守吗？</h3>
          <p class="example-given">牌桌整体偏紧。三个跟注者起手分别有 400、460 和 180；你即使跟注，也没有全下。</p>
          <details class="example-answer"><summary>看判断与计算</summary>
          <dl class="example-amounts"><div><dt>还要补</dt><dd>8</dd></div><div><dt>跟注后底池</dt><dd>62</dd></div><div><dt>按直接摊牌算的门槛</dt><dd>12.9%</dd></div></dl>
          <p class="example-decision"><strong>这手不同花弱 A 可以弃牌。</strong>你不用担心身后再加，却要在翻牌后最先面对四个人。有 A 的翻牌上，较好踢脚可能让你再付几轮；没有 A 时，你也常会在看完五张牌前弃掉。8 ÷ 62 并不保证你能拿到这部分底池。换成有坚果同花潜力的同花 A，或改为单挑宽范围，才需要重估同样的价格。原局弃牌。</p>
