          <p class="example-given">按只有开池者入池的情形算。先假设身后都弃、没中就放弃；即使你中牌必胜且对手总付清余下 32，回报是否够？</p>
          <details class="example-answer"><summary>看判断与计算</summary>
          <dl class="example-amounts"><div><dt>单挑有效筹码</dt><dd>20 BB</dd></div><div><dt>本次跟注</dt><dd>8</dd></div><div><dt>中牌时最多净赢</dt><dd>43</dd></div></dl>
          <p class="example-decision"><strong>如果只为了买一张 3，弃牌。</strong>翻牌至少出现一张 3 的概率约 11.8%。每中一次大约会落空 7.5 次，光是七次半失败的跟注就损失约 60。即使中牌时拿到现有 11 和对手余下的 32，也只净赢 43。对手更深，或你能在没中三条时也赢，才要换一种算法。原局弃牌。</p>

          <p class="example-decision"><strong>实战弃牌。偶尔跟一次，也要有具体理由。</strong>投机牌能让你的跟注范围覆盖中小连张牌面，但对方在枪口开到 4 BB，身后还有挤压风险。若后位多半弃牌，且开池者愿意在你中强牌时付钱，跟注才更有吸引力。原例的低频跟注是这种桌况下的一种混合打法。</p>

        <div class="street-review" data-at="preflop"><details class="example-answer"><summary>按钮再加到 100，第二笔 70 怎么算？</summary><p>前一笔 30 已经在底池里。你是这一轮最后行动的人，补 70 争现有的 245，两家还有较深后手；这让拿 <span class="cash-inline-hand" role="img" aria-label="TT，花色未指定"><b>TT</b><span class="cash-hand-cards"><i class="playing-card rank-only">10</i><i class="playing-card rank-only">10</i></span></span> 平跟比在后面还有人能挤压时更可行。进入翻牌后，即使三张都是小牌，也要重新估计按钮对两家持续下注的范围。</p></details></div>

          <p class="example-decision"><strong>实战弃牌。</strong>翻前第二次跟注时有 3.5∶1 的直接价格，且两名对手都有足够筹码，翻中暗三条有机会多收钱。现在你虽然是超对，但按钮仍可能有更大的对子；跟注会把底池打到接近剩余筹码。若只凭“他平时很凶”就跟，还得解释他用哪些较差的牌向两人下这样大的注。此局未摊牌。</p>
